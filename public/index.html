<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Việt Nam</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}.top{height:58px;padding:16px 18px;background:#151923;font-weight:800;font-size:21px}.app{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 58px)}.side{background:#11151d;padding:12px;overflow:auto}.search{width:100%;padding:12px;border:0;border-radius:10px;margin-bottom:10px}.group{font-size:12px;color:#9ba5b5;margin:15px 7px 5px;text-transform:uppercase}.ch{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}.ch:hover,.ch.on{background:#262d3a}.logo{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}.main{padding:18px}.video{background:#000;aspect-ratio:16/9;width:100%;max-height:78vh}.title{font-size:23px;font-weight:800;margin-top:12px}.sub{color:#9ba5b5;margin-top:4px}.badge{font-size:11px;background:#293143;padding:3px 6px;border-radius:5px;margin-left:auto}@media(max-width:760px){.app{grid-template-columns:1fr;height:auto}.side{max-height:42vh}.main{padding:8px}}
</style></head><body>
<div class="top">📺 TV Việt Nam</div><div class="app"><aside class="side"><input class="search" id="q" placeholder="Tìm kênh..."><div id="list"></div></aside><main class="main"><video id="v" class="video" controls playsinline></video><div id="name" class="title">Chọn một kênh</div><div id="meta" class="sub">Nguồn: IPTV-org / kênh của bạn</div></main></div>
<script>
let all=[],hls;const v=document.querySelector("#v"),list=document.querySelector("#list");
async function load(){const j=await(await fetch("/api/channels")).json();all=j.channels||[];render();const vtv1=all.find(x=>/^VTV\s*1$/i.test((x.name||"").trim()))||all.find(x=>/\bVTV\s*1\b/i.test(x.name||""));if(vtv1)play(String(vtv1._id));else{let last=localStorage.lastChannel;if(last)play(last)}}
function render(){const query=q.value.toLowerCase();let g="";list.innerHTML=all.filter(x=>(x.name+" "+(x.group||"")).toLowerCase().includes(query)).map(x=>{let hd="";if((x.group||"Khác")!==g){g=x.group||"Khác";hd=`<div class=group>${g}</div>`}return hd+`<div class=ch onclick='play(${JSON.stringify(String(x._id))})'>${x.logo?`<img class=logo src="${x.logo}" onerror="this.style.display='none'">`:"📺"}<div>${x.name}</div><span class=badge>${x.source==="iptv-org"?"ORG":"RIÊNG"}</span></div>`}).join("")||"<p>Chưa có kênh. Vào /admin để đồng bộ IPTV-org.</p>"}
function play(id){const x=all.find(a=>String(a._id)===id);if(!x)return;name.textContent=x.name;meta.textContent=`${x.group||"Khác"} · ${x.source==="iptv-org"?"IPTV-org":"Kênh riêng"}`;localStorage.lastChannel=id;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute("src");v.load();
if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=x.url;v.play().catch(()=>{})}
else if(Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(x.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)meta.textContent+=" · ⚠️ Stream không phát được"})}
else alert("Trình duyệt không hỗ trợ HLS")}
q.oninput=render;load();
</script></body></html>
