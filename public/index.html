<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>TV cá nhân</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script><style>body{margin:0;background:#0b0d12;color:white;font:16px Arial}.a{display:grid;grid-template-columns:300px 1fr;height:100vh}.s{padding:15px;background:#141821;overflow:auto}.m{padding:20px}input{width:100%;padding:12px;box-sizing:border-box}.c{padding:12px;margin:5px 0;background:#202632;border-radius:9px;cursor:pointer}video{width:100%;background:#000;aspect-ratio:16/9}@media(max-width:700px){.a{display:block}.s{max-height:38vh}}</style><div class=a><div class=s><h2>📺 TV cá nhân</h2><input id=q placeholder="Tìm kênh"><div id=l></div></div><div class=m><video id=v controls playsinline></video><h2 id=n>Chọn một kênh</h2></div></div><script>let A=[],h;async function load(){A=(await(await fetch("/api/channels")).json()).channels;draw()}function draw(){let z=q.value.toLowerCase();l.innerHTML=A.filter(x=>x.name.toLowerCase().includes(z)).map((x,i)=>`<div class=c onclick="play('${x._id}')">${x.logo?`<img src="${x.logo}" width=35 height=35 style="vertical-align:middle;object-fit:contain">`:"📺"} ${x.name}<small> · ${x.group}</small></div>`).join("")}function play(id){let x=A.find(a=>String(a._id)==id);n.textContent=x.name;if(h)h.destroy();if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=x.url;v.play()}else{h=new Hls();h.loadSource(x.url);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play())}}q.oninput=draw;load()</script>
