<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV Admin</title>
<style>body{font-family:Arial;max-width:1100px;margin:24px auto;padding:0 12px;background:#f4f6f8;color:#20242b}.card{background:white;padding:18px;border-radius:14px;margin-bottom:15px}input,button{padding:10px;margin:4px;border:1px solid #ccd2da;border-radius:8px}button{cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:5px}.wide{flex:1;min-width:240px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.ok{color:#087f23}.err{color:#b42318}.pill{padding:3px 7px;border-radius:10px;background:#eef1f5;font-size:11px}</style></head>
<body><h1>📺 IPTV Admin V2</h1>
<div class=card><b>Mật khẩu Admin</b><br><input id=key type=password placeholder="ADMIN_KEY"><button onclick=load()>Đăng nhập</button></div>
<div class=card><h3>IPTV-org Việt Nam</h3><p>Nguồn mặc định: <code>countries/vn.m3u</code></p><button onclick=syncOrg()>🔄 Cập nhật kênh IPTV-org</button> <span id=syncmsg></span><div id=status></div></div>
<div class=card><h3>Thêm kênh riêng</h3><div class=row><input id=n placeholder="Tên kênh"><input id=g placeholder="Nhóm"><input id=l class=wide placeholder="Logo URL"><input id=u class=wide placeholder="Stream URL"><button onclick=add()>Thêm</button></div></div>
<div class=card><h3>Import playlist M3U riêng</h3><input id=f type=file accept=".m3u,.m3u8,text/plain"><button onclick=imp()>Import</button><span id=msg></span></div>
<div class=card><h3>Danh sách kênh</h3><div style="overflow:auto"><table><thead><tr><th>Kênh</th><th>Nhóm</th><th>Nguồn</th><th>Trạng thái</th><th></th></tr></thead><tbody id=tb></tbody></table></div></div>
<script>
const K=()=>key.value;async function api(url,opt={}){opt.headers={...(opt.headers||{}),"x-admin-key":K(),"content-type":"application/json"};let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.error||j.lastError||"Lỗi");return j}
async function load(){try{let j=await api("/api/admin/channels");tb.innerHTML=j.channels.map(x=>`<tr><td>${x.name}</td><td>${x.group||""}</td><td><span class=pill>${x.source||"manual"}</span></td><td>${x.enabled!==false?"🟢":"⚫"}</td><td><button onclick="toggle('${x._id}',${x.enabled!==false})">Bật/tắt</button><button onclick="del('${x._id}')">Xóa</button></td></tr>`).join("");status.textContent=j.syncState.lastSyncAt?`Lần đồng bộ cuối: ${j.syncState.lastSyncAt} · ${j.syncState.lastImported} kênh`:"Chưa đồng bộ"}catch(e){alert(e.message)}}
async function syncOrg(){syncmsg.textContent="Đang tải...";try{let j=await api("/api/admin/sync-iptv-org",{method:"POST"});syncmsg.className="ok";syncmsg.textContent=`Đã đồng bộ ${j.lastImported} kênh`;load()}catch(e){syncmsg.className="err";syncmsg.textContent=e.message}}
async function add(){await api("/api/admin/channels",{method:"POST",body:JSON.stringify({name:n.value,group:g.value||"Khác",logo:l.value,url:u.value})});load()}
async function toggle(id,on){await api("/api/admin/channels/"+id,{method:"PUT",body:JSON.stringify({enabled:!on})});load()}
async function del(id){if(confirm("Xóa kênh?")){await api("/api/admin/channels/"+id,{method:"DELETE"});load()}}
async function imp(){let fd=new FormData();fd.append("file",f.files[0]);let r=await fetch("/api/admin/import-m3u",{method:"POST",headers:{"x-admin-key":K()},body:fd}),j=await r.json();msg.textContent=j.ok?`Đã import ${j.imported} kênh`:(j.error||"Lỗi");if(j.ok)load()}
</script></body></html>
