<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Admin IPTV</title><style>body{font:16px Arial;max-width:1000px;margin:auto;padding:20px;background:#eee}.b{background:white;padding:18px;margin:12px 0;border-radius:12px}input,button{padding:10px;margin:4px}table{width:100%}td{padding:8px;border-bottom:1px solid #ddd}</style><h1>📺 IPTV Admin</h1><div class=b><input id=k type=password placeholder=ADMIN_KEY><button onclick=load()>Đăng nhập</button></div><div class=b><h3>Thêm kênh</h3><input id=n placeholder="Tên"><input id=g placeholder="Nhóm"><input id=o placeholder="Logo URL"><input id=u placeholder="URL .m3u8"><button onclick=add()>Thêm</button></div><div class=b><h3>Import M3U</h3><input id=f type=file><button onclick=imp()>Import</button><b id=msg></b></div><div class=b><table><tbody id=t></tbody></table></div><script>async function api(x,opt={}){opt.headers={...(opt.headers||{}),"x-admin-key":k.value,"content-type":"application/json"};let r=await fetch(x,opt),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){try{let j=await api("/api/admin/channels");t.innerHTML=j.channels.map(x=>`<tr><td>${x.name}</td><td>${x.group}</td><td>${x.enabled!==false?"🟢":"⚫"}</td><td><button onclick="tog('${x._id}',${x.enabled!==false})">Bật/tắt</button><button onclick="del('${x._id}')">Xóa</button></td></tr>`).join("")}catch(e){alert(e.message)}}async function add(){await api("/api/admin/channels",{method:"POST",body:JSON.stringify({name:n.value,group:g.value,logo:o.value,url:u.value})});load()}async function tog(id,on){await api("/api/admin/channels/"+id,{method:"PUT",body:JSON.stringify({enabled:!on})});load()}async function del(id){await api("/api/admin/channels/"+id,{method:"DELETE"});load()}async function imp(){let d=new FormData();d.append("file",f.files[0]);let r=await fetch("/api/admin/import",{method:"POST",headers:{"x-admin-key":k.value},body:d}),j=await r.json();msg.textContent=" Đã import "+j.imported+" kênh";load()}</script>
